name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@c17d433f99daa94e53ca5eb566088518a312cb71
        with:
          install-mold: 'true'
      - name: Install nextest
        uses: taiki-e/install-action@db22c42b5af88356329b9a8056bb2c2f026d5a10
        with:
          tool: nextest@0.9.114
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c17d433f99daa94e53ca5eb566088518a312cb71
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@c17d433f99daa94e53ca5eb566088518a312cb71
        env:
          # The prebuilt dylint-link binary aborts its post-install
          # verification when RUSTUP_TOOLCHAIN is unset, and the source
          # fallback needs rustc >= 1.91, which the repository's pinned
          # nightly predates. Run the installer on the runner's stable
          # toolchain to satisfy both paths.
          RUSTUP_TOOLCHAIN: stable
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Set up isolated Rust for Merman
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install Merman CLI
        # Runs from the checkout, so Cargo reads .cargo/config.toml; the
        # stable 1.95.0 toolchain must never see its nightly-only `-Zthreads`
        # flag, and an assigned RUSTFLAGS displaces every `rustflags` table.
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked
      - name: Spelling
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie
      - name: Workflow contract tests
        run: make test-workflow-contracts
      # The coverage step below runs the whole nextest suite (`make test`'s
      # scope: every workspace target with every feature), so it is the only
      # place the suite runs. The cucumber harness has its own `main`, which
      # nextest cannot execute, so it keeps a step of its own, after the
      # CodeScene upload so that a failing scenario cannot stop the upload.
      # tests/workflow_contracts/suite_runs_once_test.py holds the split.
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@c17d433f99daa94e53ca5eb566088518a312cb71
        with:
          output-path: lcov.info
          format: lcov
          all-features: 'true'
          all-targets: 'true'
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c17d433f99daa94e53ca5eb566088518a312cb71
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
      - name: Run the cucumber scenarios
        if: ${{ !cancelled() }}
        run: make test-cucumber
