# Align with CodeScene’s ceiling
cognitive-complexity-threshold = 12     # default is 25

# Tests must not change the process-wide environment or working directory: it
# forces the runner to serialize them. Inject an environment object or isolate
# the change to a subprocess (`Command::env`, `Command::current_dir`). A site that
# cannot yet migrate carries `#[expect(clippy::disallowed_methods, reason = ...)]`,
# which reports itself once the site is gone.
disallowed-methods = [
    { path = "std::env::set_var", reason = "process-wide env mutation; inject an environment or use a subprocess" },
    { path = "std::env::remove_var", reason = "process-wide env mutation; inject an environment or use a subprocess" },
    { path = "std::env::set_current_dir", reason = "process-wide working directory; pass the directory in or use Command::current_dir" },
]
